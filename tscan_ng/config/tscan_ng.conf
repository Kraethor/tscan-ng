# tscan-ng runtime configuration
# Deploy to /opt/tscan/tscan_ng/config/tscan_ng.conf
# Owned and readable by the tscan service account only.
# After editing, restart both services:
#   sudo systemctl restart tscan-dispatcher tscan-capture

[capture]
# Network interface to capture from (SPAN/mirror destination)
iface               = enx606d3cba05d2

# Maximum bytes captured per packet
snaplen             = 65535

# Kernel capture ring buffer size in bytes (default 32MB)
buffer_bytes        = 33554432

# Set to true to disable immediate mode (use 1ms poll timeout instead)
no_immediate        = true

[dispatcher]
# Number of worker processes (default: CPU count)
workers             = 4

# Unix datagram socket path (must be on tmpfs, matches systemd unit)
socket              = /run/tscan/tscan.sock

# JSONL output file
out                 = /var/log/tscan/results.jsonl

[sessions]
# Seconds of inactivity before a session is expired
timeout_seconds     = 60

# Maximum bytes buffered per direction per session (default 1MB)
max_buf_bytes       = 1048576

# How often (seconds) each worker runs the session expiry sweep
expiry_interval_sec = 30

[ports]
# Comma-separated TCP port numbers for each protocol detector.
# Sessions whose src or dst port is not in the list are skipped by that detector.
# Add non-standard ports here without touching source code.
ftp    = 21, 2121
smtp   = 25, 465, 587, 2525
imap   = 143, 993, 1430
pop3   = 110, 995, 1100
telnet = 23, 2323
ldap   = 389, 3268
redis  = 6379, 6380
